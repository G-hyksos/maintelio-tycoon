name: Build mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Générer les dossiers natifs
        run: flutter create . --platforms=android,ios --org com.ghyksos --project-name maintelio_tycoon

      - name: Configurer Android et iOS
        run: python3 tool/patch_platforms.py

      - name: Icône de l'application
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Clé de signature Play Store (optionnelle)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Compiler l'APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=LEADERBOARD_URL=$LEADERBOARD_URL

      - name: Compiler l'App Bundle Play Store
        if: env.HAS_KEYSTORE == 'true'
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=LEADERBOARD_URL=$LEADERBOARD_URL

      - name: Renommer les fichiers
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/maintelio_tycoon.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab dist/maintelio_tycoon.aab
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: maintelio-tycoon-android
          path: dist/

  ios:
    name: iOS
    runs-on: macos-latest
    env:
      HAS_APPLE: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Générer les dossiers natifs
        run: flutter create . --platforms=android,ios --org com.ghyksos --project-name maintelio_tycoon

      - name: Configurer Android et iOS
        run: python3 tool/patch_platforms.py

      - name: Icône de l'application
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Compiler iOS (non signé)
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=LEADERBOARD_URL=$LEADERBOARD_URL

      - name: Empaqueter l'IPA non signée
        run: |
          mkdir -p dist build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          (cd build/ios/unsigned && zip -qry "$GITHUB_WORKSPACE/dist/maintelio_tycoon_non_signe.ipa" Payload)

      - name: Compiler pour le simulateur iOS
        run: |
          flutter build ios --simulator --debug --dart-define=LEADERBOARD_URL=$LEADERBOARD_URL
          (cd build/ios/iphonesimulator && zip -qry "$GITHUB_WORKSPACE/dist/maintelio_tycoon_simulateur.zip" Runner.app)

      - uses: actions/upload-artifact@v6
        with:
          name: maintelio-tycoon-ios
          path: dist/

      - name: Signer et envoyer sur TestFlight (optionnel)
        if: env.HAS_APPLE == 'true'
        continue-on-error: true
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=LEADERBOARD_URL=$LEADERBOARD_URL
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$API_KEY_ID"
                -authenticationKeyIssuerID "$API_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" "${AUTH[@]}"
          rm -f "$KEY_PATH"
